<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Watch Heart Overlay</title>
    <link rel="stylesheet" href="./overlay.css">
  </head>
  <body>
    <main class="overlay-shell">
      <div class="overlay-controls">
        <button id="overlay-smaller" type="button" title="缩小">−</button>
        <button id="overlay-larger" type="button" title="放大">＋</button>
        <button id="overlay-lock" type="button" title="开启鼠标穿透" aria-pressed="false">⌁</button>
        <button id="overlay-close" type="button" title="关闭">×</button>
      </div>
      <section id="overlay-users" class="overlay-users" aria-label="用户心率"></section>
    </main>
    <script src="./web-bridge.js"></script>
    <script src="./overlay.js"></script>
  </body>
</html>
